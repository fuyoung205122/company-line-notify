name: Rain Monitor Cron Job

on:
  schedule:
    # GitHub Actions 使用 UTC 時間。每 10 分鐘執行一次，避開整點降低延遲。
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch: # 允許在 GitHub 網頁上手動點擊執行測試
    inputs:
      run_mode:
        description: '執行模式'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - force-weather-check
          - test-line

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 取得最新程式碼與狀態
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. 安裝必要套件
        run: pip install -r requirements.txt

      - name: 4. 執行降雨監控程式
        env:
          # 將您在 GitHub Secrets 裡設定的密碼傳給 Python
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_mode }}" = "test-line" ]; then
            python rain_monitor.py --test-line
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_mode }}" = "force-weather-check" ]; then
            python rain_monitor.py --force
          else
            python rain_monitor.py
          fi

      - name: 5. 儲存狀態檔與日誌 (若有更新)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if [ -f history_log.csv ]; then git add history_log.csv; fi
          if [ -f dashboard_data.json ]; then git add dashboard_data.json; fi
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update state and logs [skip ci]" && git push)
