<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廠區降雨監控儀表板</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>廠區降雨監控系統</h1>
        </header>

        <section class="health-dashboard">
            <div class="health-card" id="sys-status-card">
                <h3 id="sys-status-title"><span id="heartbeat-dot" class="status-dot"></span> 系統狀態：連線中...</h3>
                <p id="sys-last-update">最後更新：載入中</p>
                <p id="sys-delay">資料延遲：--</p>
            </div>
            <div class="health-card">
                <h3>📈 系統健康度</h3>
                <p id="sys-health-status">--</p>
                <p id="sys-success-rate" class="sub-text">成功率：--</p>
                <p id="sys-last-success" class="sub-text">最後成功：--</p>
            </div>
            <div class="health-card">
                <h3>⏱️ 執行耗時</h3>
                <p id="sys-duration">-- 秒</p>
                <p class="sub-text">Run ID: <a id="sys-run-id" href="#" target="_blank">--</a></p>
            </div>
        </section>

        <div class="action-buttons">
            <button id="refresh-btn" class="refresh-btn">
                🔄 立即更新
            </button>
            <button id="run-btn" class="refresh-btn run-btn">
                🚀 立即執行檢查
            </button>
            <div id="action-status"></div>
            <div id="refresh-status" style="display:none;"></div>
        </div>

        <section class="status-card" id="status-card">
            <h2 id="status-title">狀態判定中...</h2>
            <p id="status-subtitle">請稍候</p>
        </section>

        <section class="details-grid">
            <div class="detail-card">
                <h3>🌧️ 測站雨量</h3>
                <p id="val-rain">-- mm</p>
            </div>
            <div class="detail-card">
                <h3>📡 雷達回波 (5km)</h3>
                <p id="val-radar">-- 點</p>
            </div>
            <div class="detail-card">
                <h3>⚡ 最大強度</h3>
                <p id="val-dbz">-- dBZ</p>
            </div>
            <div class="detail-card">
                <h3>📝 天氣現象</h3>
                <p id="val-weather">--</p>
            </div>
            <div class="detail-card">
                <h3>🌐 目前運作模式</h3>
                <p id="val-source" style="font-size: 1rem; margin-top: 0.5rem;">--</p>
            </div>
        </section>

        <section class="reason-card">
            <h3>判斷依據</h3>
            <ul id="val-reason-list" class="reason-list">
                <li>載入中...</li>
            </ul>
        </section>
        
        <section class="history-section">
            <h2>最近 24 小時紀錄</h2>
            <div class="table-container">
                <table id="history-table">
                    <thead>
                        <tr>
                            <th>時間</th>
                            <th>雨量</th>
                            <th>雷達(5km)</th>
                            <th>最大dBZ</th>
                            <th>結果</th>
                            <th>判斷依據</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- 動態插入 -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
