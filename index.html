<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廠區降雨監控儀表板</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>廠區降雨監控系統</h1>
            <p id="last-update">最後更新時間: 載入中...</p>
        </header>

        <section class="status-card" id="status-card">
            <h2 id="status-title">狀態判定中...</h2>
            <p id="status-subtitle">請稍候</p>
        </section>

        <section class="details-grid">
            <div class="detail-card">
                <h3>🌧️ 測站雨量</h3>
                <p id="val-rain">-- mm</p>
            </div>
            <div class="detail-card">
                <h3>📡 雷達回波 (5km)</h3>
                <p id="val-radar">-- 點</p>
            </div>
            <div class="detail-card">
                <h3>⚡ 最大強度</h3>
                <p id="val-dbz">-- dBZ</p>
            </div>
        </section>

        <section class="reason-card">
            <h3>判斷依據</h3>
            <p id="val-reason">載入中...</p>
        </section>
        
        <section class="history-section">
            <h2>最近 24 小時紀錄</h2>
            <div class="table-container">
                <table id="history-table">
                    <thead>
                        <tr>
                            <th>時間</th>
                            <th>雨量</th>
                            <th>雷達(5km)</th>
                            <th>最大dBZ</th>
                            <th>結果</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- 動態插入 -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
